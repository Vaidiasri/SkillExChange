name: CI/CD Pipeline to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/myapp:latest
            ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}

      # Prepare environment variables dynamically
      - name: Create .env file for Docker Compose
        run: |
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "IMAGE_TAG=${{ github.sha }}" >> .env

      - name: Copy docker-compose and .env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,.env"
          target: "~/fastapi-app/"

      - name: Deploy with Zero-Downtime via Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Exit on any unhandled error
            set -e
            
            # Go to app directory
            cd ~/fastapi-app/

            # Clean up old tags (optional hygiene)
            docker system prune -f

            # Start or update the required infrastructure (Database)
            docker compose up -d db

            # Login to Docker Hub using secrets directly (from .env)
            source .env
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            
            # Pull the new image first (avoids downtime during download)
            echo "Pulling new image version $IMAGE_TAG..."
            docker pull $DOCKER_USERNAME/myapp:$IMAGE_TAG

            # Find the ID of the currently running web container (if any)
            OLD_CONTAINER_ID=$(docker ps -q -f name=fastapi-app-web)
            
            # Force recreating ONLY the web service with the new image, 
            # while scaling them up (running side-by-side conceptually is hard without LB,
            # so we'll do a quick replace strategy via standard compose)
            echo "Starting new web container..."
            docker compose up -d --no-deps --build web
            
            # Health check loop (Wait up to 30 seconds for the container to become healthy/running)
            echo "Waiting for new container to stabilize..."
            sleep 10
            
            # Verify if the NEW container is actually running
            NEW_CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' $(docker compose ps -q web))
            
            if [ "$NEW_CONTAINER_STATUS" = "running" ]; then
                echo "✅ Deployment successful. New container is running."
                # We can safely clean up older unused web images now
                docker image prune -a --filter "until=1h" -f
            else
                echo "❌ Deployment FAILED. New container crashed."
                # Print logs for debugging
                docker compose logs web
                
                # Rollback strategy: 
                # Since docker-compose tracks state, rolling back requires pointing back to the old tag if needed,
                # but standard `docker compose down` and `up` on the old image is safer.
                # If we had a load balancer, we would just flip traffic. Here, we restore the old state.
                echo "Rolling back to previous state..."
                # Extract the old image name from the old container
                if [ -n "$OLD_CONTAINER_ID" ]; then
                   OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' $OLD_CONTAINER_ID)
                   echo "Restoring image $OLD_IMAGE..."
                   # Force compose to run the old image by overriding the environment
                   export IMAGE_TAG=$(echo $OLD_IMAGE | cut -d':' -f2)
                   docker compose up -d --no-deps web
                fi
                exit 1 # Fail the pipeline
            fi
